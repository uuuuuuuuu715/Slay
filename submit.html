<div class="site-main">
<main class="design-page" style="--page-bg:#9bc2bb;--page-text:#251916;">
<img class="design-piece" src="submit-top.png" alt="Get in the cave — Submit Here">
<section class="submit-content">
<form class="submit-card" action="https://formspree.io/f/xdenazag" method="POST" enctype="multipart/form-data">
  <h2>Send it over</h2>

  <input type="hidden" name="_subject" value="New Plato's Rave submission">
  <input type="hidden" name="_template" value="table">

  <div class="form-row">
    <label for="submission-name">Name</label>
    <input id="submission-name" type="text" name="name" required autocomplete="name">
  </div>

  <div class="form-row">
    <label for="submission-email">Email</label>
    <input id="submission-email" type="email" name="email" required autocomplete="email">
  </div>

  <div class="form-row">
    <label for="submission-type">What are you sending?</label>
    <select id="submission-type" name="medium" required>
      <option value="" selected disabled>Select one</option>
      <option>Photography</option>
      <option>Art</option>
      <option>Essay</option>
      <option>Poem</option>
      <option>Critical review</option>
      <option>Short fiction</option>
      <option>Illustration / visual essay</option>
      <option>Interview</option>
      <option>Fashion or cultural feature</option>
      <option>Other</option>
    </select>
  </div>

  <div class="form-row">
    <label for="submission-note">Anything we should know?</label>
    <textarea id="submission-note" name="message" placeholder="Optional note, title, context, links, etc."></textarea>
  </div>

  <div class="form-row">
<label>Link to your work</label>
<div class="form-row">
  <input
    id="attachment"
    type="url"
    name="submission_link"
    placeholder="Paste a Google Docs or Google Drive link here"
    required
  >
</div>
<input id="attachment" type="url" name="submission_link"
       placeholder="Paste a Google Docs link here" required>
    </div>
  </div>

  <button class="submit-button" type="submit">Send submission</button>
  <p class="submit-note">The form needs a one-time email-delivery setup before it can send from GitHub Pages. See SUBMISSION-SETUP.txt.</p>
</form>
</section>
<img class="design-piece" src="submit-bottom.png" alt="">
</main></div>
<script src="sidebar.js?v=2"></script>
</body></html>
