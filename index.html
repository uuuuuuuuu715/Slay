  <style>
  #caveTrace {
    position: absolute;
    left: 14%;
    top: 31%;
    width: 74%;
    height: 37%;
    z-index: 50;
    pointer-events: none;
    overflow: visible;
    opacity: 1;
    transition: opacity .5s ease;
  }

  #caveTrace path {
    fill: none;
    stroke: #f6dfaa;
    stroke-width: 0.8;
    stroke-linecap: round;
    stroke-linejoin: round;

    filter:
      drop-shadow(0 0 1.5px #f6dfaa)
      drop-shadow(0 0 4px rgba(246,223,170,.7));

    stroke-dasharray: 1;
    stroke-dashoffset: 1;

    animation:
      drawCave 1.5s ease-out forwards,
      cavePulse .7s ease-in-out 1.5s 3 alternate;
  }

  @keyframes drawCave {
    from {
      stroke-dashoffset: 1;
    }

    to {
      stroke-dashoffset: 0;
    }
  }

  @keyframes cavePulse {
    from {
      opacity: .45;
    }

    to {
      opacity: 1;
      filter:
        drop-shadow(0 0 3px #f6dfaa)
        drop-shadow(0 0 8px rgba(246,223,170,.9));
    }
  }
</style>

<script>
window.addEventListener("load", function () {

  const poster = document.getElementById("poster");
  const button = document.getElementById("pushButton");

  if (!poster || !button) return;

  poster.style.position = "relative";

  const trace = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "svg"
  );

  trace.id = "caveTrace";
  trace.setAttribute("viewBox", "0 0 100 100");

  trace.innerHTML = `
    <path
      pathLength="1"
      d="
        M 8 58

        C 7 39,
          15 19,
          34 10

        C 49 3,
          70 7,
          84 21

        C 95 32,
          98 51,
          91 68

        C 85 84,
          67 94,
          47 94

        C 27 94,
          12 83,
          8 67

        C 7 64,
          7 61,
          8 58
        Z
      "
    />
  `;

  poster.appendChild(trace);

  function removeTrace() {
    trace.style.opacity = "0";

    setTimeout(function () {
      trace.remove();
    }, 500);
  }

  button.addEventListener("click", removeTrace, { once: true });

  /* Let it trace + glow, then disappear on its own */
  setTimeout(removeTrace, 4300);

});
</script>
