<style>
#sisyphus-tip {
  position: absolute;
  left: 28%;
  top: 43%;
  z-index: 9999;

  background: #f3e4be;
  color: #3b2417;

  border: 1px solid #8e6a3d;
  border-radius: 4px;

  padding: 8px 12px;

  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(16px, 1.6vw, 23px);
  font-style: italic;
  letter-spacing: .02em;

  box-shadow: 0 3px 8px rgba(0,0,0,.16);

  pointer-events: none;

  opacity: 0;
  transform: rotate(-15deg) translateY(5px); 

  animation: showSisyphusTip .45s ease 1s forwards;
}

#sisyphus-tip::after {
  content: "";
  position: absolute;

  left: 24px;
  bottom: -8px;

  width: 14px;
  height: 14px;

  background: #f3e4be;

  border-right: 1px solid #8e6a3d;
  border-bottom: 1px solid #8e6a3d;

  transform: rotate(45deg);
}

@keyframes showSisyphusTip {
  to {
    opacity: 1;
    transform: rotate(-15deg) translateY(0);
  }
}

#sisyphus-tip.hide {
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity .25s ease, transform .25s ease;
}
</style>

<script>
window.addEventListener("load", function () {

  const poster = document.getElementById("poster");
  const button = document.getElementById("pushButton");

  if (!poster || !button) return;

  poster.style.position = "relative";

  const tip = document.createElement("div");

  tip.id = "sisyphus-tip";
  tip.textContent = "Give me a hand?";

  poster.appendChild(tip);

  button.addEventListener("click", function () {

    tip.classList.add("hide");

    setTimeout(function () {
      tip.remove();
    }, 300);

  }, { once: true });

});
</script>
